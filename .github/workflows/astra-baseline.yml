name: Astra single-pass baseline
on:
  push:
    paths:
      - 'examples/astra_baseline/**'
      - '.github/workflows/astra-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-first-response:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            threejs
            examples/astra_baseline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned official runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --prefix threejs --ignore-scripts
          (cd threejs && npx playwright install --with-deps chromium)
      - name: Extract the unmodified first response and verify provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          fixture = Path('examples/astra_baseline/video1_l1_no_refine')
          data = (fixture / 'first_response.json').read_bytes()
          provenance = json.loads((fixture / 'provenance.json').read_text())
          assert hashlib.sha256(data).hexdigest() == provenance['response_sha256']
          response = json.loads(data)
          assert set(response) == {'scene_source', 'report'}
          assert all(isinstance(v, str) for v in response.values())
          source = response['scene_source'].encode('utf-8')
          assert hashlib.sha256(source).hexdigest() == provenance['scene_sha256']
          output = Path('runs/astra-video1-l1')
          output.mkdir(parents=True)
          (output / 'scene.mjs').write_bytes(source)
          PY
          node --check runs/astra-video1-l1/scene.mjs
      - name: Render full reference timeline in an isolated network namespace
        run: |
          # Fresh disposable hosted VM; no secrets, persisted checkout token, or
          # model API calls. Only loopback is available to the render process.
          # Run as the ordinary unprivileged runner, with Chromium sandbox ON.
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            ulimit -t 900
            ulimit -f 2097152
            exec runuser -u runner -- env -i PATH="$1" HOME="$2" \
              node threejs/render.mjs \
              --scene runs/astra-video1-l1/scene.mjs \
              --output runs/astra-video1-l1 \
              --width 1910 --height 1080 --fps 24000/1001 --frames 384 --seed 0
          ' _ "$PATH" "$HOME"
      - name: Return compact output bundle in logs
        if: always()
        run: python examples/astra_baseline/package_result.py
